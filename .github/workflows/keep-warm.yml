# Keep the deployed demo alive. Supabase's free tier pauses a project's database after ~7 days
# without activity, which would turn the live portfolio site into a dead link. This pings the API's
# /health endpoint (which runs a real query) every 3 days so the database never goes idle long
# enough to pause. It also nudges a sleeping backend host awake.
#
# Activate it after deploying by setting a repository VARIABLE (Settings -> Secrets and variables
# -> Actions -> Variables) named KEEPALIVE_URL to the live health URL, e.g.
# https://your-api.example.com/api/health. Until that's set, the job skips harmlessly.
name: Keep warm

on:
    schedule:
        - cron: '0 6 */3 * *' # 06:00 UTC every 3rd day
    workflow_dispatch: # also runnable by hand from the Actions tab

jobs:
    ping:
        runs-on: ubuntu-latest
        if: ${{ vars.KEEPALIVE_URL != '' }}
        steps:
            - name: Ping the API health endpoint
              run: curl --fail --silent --show-error --max-time 60 "${{ vars.KEEPALIVE_URL }}"
