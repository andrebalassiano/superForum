# Throwaway Postgres for the automated test suite.
# Local runs:  docker compose -f docker-compose.test.yml up -d
# Tear down:   docker compose -f docker-compose.test.yml down
# CI uses GitHub Actions' own `services: postgres` block instead of this file.
#
# Port 5433 (not 5432) so it never collides with a local/production Postgres.
# tmpfs keeps the data in RAM: fast, and wiped when the container stops.
services:
  db:
    image: postgres:16
    container_name: superforum_test_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: superforum_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d superforum_test']
      interval: 2s
      timeout: 3s
      retries: 15
